[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internradar"
version = "0.1.0"
description = "Intern Radar CLI skeleton."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Intern Radar contributors" },
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<0.29",
  "Jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "pydantic>=2,<3",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
internradar = "internradar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["internradar*"]

[tool.setuptools.package-data]
"internradar.export" = ["templates/*.j2"]
"internradar.dashboard" = [
  "frontend/index.html",
  "frontend/package.json",
  "frontend/tsconfig.json",
  "frontend/vite.config.ts",
  "frontend/dist/*",
  "frontend/dist/assets/*",
  "frontend/src/**/*",
  "frontend/styles/*"
]
