[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internradar"
version = "0.1.0"
description = "Intern Radar CLI skeleton."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Intern Radar contributors" },
]
dependencies = [
  "PyYAML>=6,<7",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
internradar = "internradar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["internradar*"]
