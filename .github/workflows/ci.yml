name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: CLI smoke tests
        run: |
          python -m internradar --help
          python -m internradar scan --help
          python -m internradar export --help
          python -m internradar discover queries --pack quant_engineering --limit 5
          python -m internradar firms validate --pack quant_engineering

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: internradar/dashboard/frontend/package-lock.json

      - name: Build dashboard frontend
        working-directory: internradar/dashboard/frontend
        run: |
          npm ci
          npm run build
